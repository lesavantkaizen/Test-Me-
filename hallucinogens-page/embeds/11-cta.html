<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2782B2;--blue-bright:#4FA9D6;--blue-deep:#1F6A92;
  --navy:#143247;--navy-2:#0F2535;
  --orange:#E8A15B;
  --ease:cubic-bezier(.22,.61,.36,1);--r-lg:26px;
  --ff-display:"Fraunces",Georgia,serif;
  --ff-body:"Nunito Sans",-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--ff-body);color:var(--navy);background:transparent;-webkit-font-smoothing:antialiased;line-height:1.6;}
.divider-wrap{max-width:1300px;margin:0 auto;padding:clamp(28px,3.2vw,48px) clamp(20px,5vw,72px);}
.divider{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 60%,#11364e 100%);border-radius:var(--r-lg);padding:clamp(34px,4.4vw,60px) clamp(24px,4.5vw,64px);opacity:0;transform:translateY(22px);transition:opacity .65s var(--ease),transform .65s var(--ease);}
.divider.in{opacity:1;transform:none;}
.divider::before{content:"";position:absolute;top:-180px;right:-120px;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(79,169,214,.35),transparent 65%);filter:blur(30px);}
.divider::after{content:"";position:absolute;bottom:-200px;left:-100px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(232,161,91,.18),transparent 65%);filter:blur(36px);}
.divider>*{position:relative;z-index:1;}
.kicker{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--blue-bright);margin-bottom:14px;}
.kicker::before{content:"";width:22px;height:2px;border-radius:2px;background:var(--blue-bright);}
h2{font-family:var(--ff-display);font-weight:600;font-size:clamp(26px,3.1vw,38px);line-height:1.08;letter-spacing:-.025em;color:#fff;margin-bottom:14px;}
.lead{font-size:clamp(15px,1.45vw,17px);line-height:1.7;color:rgba(255,255,255,.78);}
.cta-row{display:flex;gap:11px;flex-wrap:wrap;align-items:center;margin-top:26px;}
.btn{display:inline-flex;align-items:center;gap:9px;font-family:var(--ff-body);font-weight:800;font-size:14px;padding:13px 24px;border-radius:50px;text-decoration:none;cursor:pointer;transition:background .3s,color .3s,transform .3s;}
.btn-primary{background:#fff;color:var(--navy);border:1px solid #fff;}
.btn-primary:hover{background:var(--blue-bright);border-color:var(--blue-bright);color:var(--navy-2);transform:translateY(-1px);}
.btn-secondary{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);}
.btn-secondary:hover{background:rgba(255,255,255,.08);border-color:#fff;transform:translateY(-1px);}
.btn svg{width:15px;height:15px;stroke:currentColor;stroke-width:2.2;fill:none;transition:transform .3s;}
.btn:hover svg{transform:translateX(3px);}
@media(prefers-reduced-motion:reduce){*{transition:none!important;}.divider{opacity:1!important;transform:none!important;}}
</style>
</head>
<body>
<div class="divider-wrap">
  <div class="divider">
    <span class="kicker">Recovery Starts Here</span>
    <h2>Take the first confidential step</h2>
    <p class="lead">If hallucinogen use is affecting your life or someone you love, you don't have to figure it out alone. Verify your insurance in minutes — free, confidential, and with no obligation.</p>
    <div class="cta-row">
      <a href="https://www.launchtowellness.com/admissions/verify-insurance" class="btn btn-primary">Verify Insurance <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a>
      <a href="tel:424-327-4040" class="btn btn-secondary">Contact Admissions</a>
    </div>
  </div>
</div>
<script>
  const el=document.querySelector('.divider');
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:0,rootMargin:'0px 0px -8% 0px'});
    io.observe(el);
  }else{el.classList.add('in');}
</script>
</body>
</html>
